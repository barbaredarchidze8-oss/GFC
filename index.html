<!doctype html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GFC სპორტ კომპლექსი</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root { --red:#e10613; --bg:#0b0b0c; --card:#17171a; }
    * { box-sizing:border-box; }
    body { margin:0; overflow:hidden; background:var(--bg); color:#f2f1ed; font-family:'Noto Sans Georgian',sans-serif; }
    #c { width:100vw; height:100vh; display:block; }
    header { position:fixed; z-index:10; top:16px; left:16px; display:flex; align-items:center; gap:14px;
      background:#000a; padding:8px 18px 8px 8px; border-radius:16px; border:1px solid #2c2c30; }
    header img { width:56px; height:56px; object-fit:contain; border-radius:10px; }
    header .logo-fallback { display:none; width:56px; height:56px; align-items:center; justify-content:center;
      color:#e10613; font-size:20px; font-weight:800; }
    header b { font-size:20px; font-weight:800; display:block; }
    header span { font-size:13px; color:#a9abb3; }
    #ui { position:fixed; left:16px; bottom:16px; width:270px; background:#000a; padding:16px;
      border-radius:16px; border:1px solid #2c2c30; display:flex; flex-direction:column; gap:10px; }
    #ui label { font-size:14px; color:#a9abb3; }
    #ui input { width:100%; accent-color:var(--red); }
    button { background:var(--red); color:#fff; border:0; padding:10px 14px; border-radius:10px;
      font-family:inherit; font-weight:600; cursor:pointer; font-size:14px; }
    button:hover { background:#ff2434; }
    #panel { position:fixed; right:16px; top:16px; width:340px; background:var(--card); border:1px solid #2c2c30;
      border-top:6px solid var(--red); border-radius:16px; padding:18px; display:none; }
    #panel img { width:100%; height:170px; object-fit:cover; border-radius:10px; margin-bottom:12px; display:none; }
    #panel h3 { margin:0 0 8px; font-size:22px; }
    #panel p { margin:0; color:#c9cad1; line-height:1.5; font-size:15px; }
    #panel .close { position:absolute; right:12px; top:12px; padding:2px 10px; background:#2c2c30; }
    #tip { position:fixed; bottom:16px; right:16px; color:#a9abb3; font-size:13px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <header>
    <img src="/img/logo.jpg" alt="GFC logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'" />
    <span class="logo-fallback" aria-hidden="true">GFC</span>
    <div><b>GFC სპორტ კომპლექსი</b><span>Georgian Fitness Club</span></div>
  </header>
  <div id="ui">
    <label>დაშლა (სართულები)</label>
    <input id="explode" type="range" min="0" max="1" step="0.01" value="0" />
    <button id="tour">▶ ავტომატური ტური</button>
  </div>
  <div id="panel">
    <button class="close" id="close">✕</button>
    <img id="pimg" alt="" />
    <h3 id="pt"></h3>
    <p id="pd"></p>
  </div>
  <div id="tip">მაუსი: ბრუნვა · ბორბალი: ზუმი · კლიკი ზონაზე: დეტალები</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
